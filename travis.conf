# travis-player mpv config
# place this at %APPDATA%\mpv\mpv.conf, or pass --config-dir to mpv

# ── video output ─────────────────────────────────────────────────────────────
vo=gpu
gpu-api=d3d11         # d3d11 on windows; change to opengl if issues arise
# alpha=blend          # uncomment once window transparency wrapper is ready

# ── window ───────────────────────────────────────────────────────────────────
title=travis-player
ontop=yes
border=no

# ── shaders ──────────────────────────────────────────────────────────────────
# loaded at startup — can also be toggled live via travis_controls.lua
# (path is relative; adjust if you move the shader)
# glsl-shaders=~~/../shaders/motion_mask.glsl

# ── script ───────────────────────────────────────────────────────────────────
# scripts-dir=~~/../scripts

# ── script-opts ──────────────────────────────────────────────────────────────
# defaults — override here or at runtime via ctrl+arrows
script-opts=travis-alpha_floor=0.05,travis-activity_threshold=0.08,travis-blur_radius=2.0,travis-debug_mode=0

# ── performance ──────────────────────────────────────────────────────────────
video-sync=display-resample
interpolation=yes
tscale=oversample
hwdec=auto-safe

# ── osd ──────────────────────────────────────────────────────────────────────
osd-level=1
osd-font-size=32
